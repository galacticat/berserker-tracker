<div class="stat-banner">
            <div class="stat-item">
                <div>Round</div>
                <div class="stat-val" id="disp-round">{{ state.roundNum }}</div>
            </div>
            <!-- STR BANNER ITEM -->
            <div class="stat-item">
                <div>Strength (STR)</div>
                <div class="stat-val" id="disp-str">
                    {% if state.insaneStrengthActive %}
                        {{ state.currentStr * 2 }} ({{ state.currentStr }}x2)
                    {% else %}
                        {{ state.currentStr }} / {{ state.maxStr }}
                    {% endif %}
                </div>
                <div class="buff-controls">
                    <button type="button" class="buff-btn" onclick="adjustStr(5)">+5</button>
                    <button type="button" class="buff-btn" onclick="adjustStr(1)">+1</button>
                    <button type="button" class="buff-btn" onclick="adjustStr(-1)">-1</button>
                    <button type="button" class="buff-btn" onclick="adjustStr(-5)">-5</button>
                </div>
            </div>
            <!-- ADDS BANNER ITEM -->
            <div class="stat-item">
                <div>Active Adds</div>
                <div class="stat-val" id="disp-adds">+{{ state.currentAdds + (state.currentStr if state.insaneStrengthActive else 0) }}</div>
                <div class="buff-controls">
                    <button type="button" class="buff-btn" onclick="adjustAdds(5)">+5</button>
                    <button type="button" class="buff-btn" onclick="adjustAdds(1)">+1</button>
                    <button type="button" class="buff-btn" onclick="adjustAdds(-1)">-1</button>
                    <button type="button" class="buff-btn" onclick="adjustAdds(-5)">-5</button>
                </div>
            </div>
        </div>
